groups:
- neurodata_type_def: GuppyRecordingSitesTable
  neurodata_type_inc: DynamicTable
  doc: Registry of GuPPy recording sites (one row per recording site, e.g. 
    'dms'). A GuPPy recording site is a processing-level entity -- a 
    signal+isosbestic pair collapsed into one derived signal -- so it is the 
    canonical recording-site identity that GuPPy products reference.
  datasets:
  - name: recording_site
    neurodata_type_inc: VectorData
    dtype: text
    doc: The semantic recording-site name from storesList.csv (e.g. 'dms'). The 
      recording site's identity.
  - name: fiber_photometry_table_region
    neurodata_type_inc: DynamicTableRegion
    doc: Optional ragged reference into the acquisition FiberPhotometryTable 
      (the signal + isosbestic fiber rows for this recording site). Absorbs the 
      signal/control many-to-one mapping once, here, so products reference a 
      single recording-site row and reach the physical fiber provenance through 
      it. Populated at conversion time by a converter that owns the acquisition 
      side (see the neuroconv GuppyInterface).
    quantity: '?'
  - name: fiber_photometry_table_region_index
    neurodata_type_inc: VectorIndex
    doc: Ragged index for fiber_photometry_table_region (multiple fiber rows per
      recording site).
    quantity: '?'
- neurodata_type_def: GuppyEventsTable
  neurodata_type_inc: DynamicTable
  doc: Registry of behavioral events GuPPy aligned to (one row per event, e.g. 
    'port_entries'). The canonical event identity that GuPPy peri-event products
    reference.
  datasets:
  - name: event_name
    neurodata_type_inc: VectorData
    dtype: text
    doc: The semantic event name from storesList.csv (e.g. 'port_entries').
  - name: events
    neurodata_type_inc: DynamicTableRegion
    doc: Optional ragged reference into the merged pynwb EventsTable (in 
      nwbfile.events) selecting this event type's occurrence rows. Populated at 
      conversion time by a converter that merges every event type into one 
      EventsTable (see the neuroconv GuppyInterface).
    quantity: '?'
  - name: events_index
    neurodata_type_inc: VectorIndex
    doc: Ragged index for events (multiple occurrence rows per event type).
    quantity: '?'
- neurodata_type_def: GuppyDerivedResponseSeries
  neurodata_type_inc: FiberPhotometryResponseSeries
  doc: A GuPPy-derived continuous trace (control_fit, dff, or z_score) for one 
    recording site. Extends FiberPhotometryResponseSeries to stamp the 
    trace_type and to reference the GuPPy recording sites registry; the 
    inherited fiber_photometry_table_region still carries the physical 
    signal+isosbestic fiber provenance.
  attributes:
  - name: trace_type
    dtype: text
    doc: "The GuPPy normalized trace this object was computed from. Controlled vocabulary:
      'control_fit', 'dff', or 'z_score'."
  datasets:
  - name: recording_site
    neurodata_type_inc: DynamicTableRegion
    doc: Reference to the GuppyRecordingSitesTable row for this trace's 
      recording site (single row).
- neurodata_type_def: GuppyTransientsTable
  neurodata_type_inc: DynamicTable
  doc: GuPPy-detected transient peaks for one (recording_site, trace_type).
  attributes:
  - name: trace_type
    dtype: text
    doc: "The GuPPy normalized trace this object was computed from. Controlled vocabulary:
      'control_fit', 'dff', or 'z_score'."
  - name: unit
    dtype: text
    doc: Unit of the amplitude (matches the trace_type).
  datasets:
  - name: recording_site
    neurodata_type_inc: DynamicTableRegion
    doc: Reference to the GuppyRecordingSitesTable row for this table's 
      recording site (single row).
  - name: timestamp
    neurodata_type_inc: VectorData
    dtype: float64
    doc: Timestamp of the detected transient peak (seconds, session clock).
  - name: amplitude
    neurodata_type_inc: VectorData
    dtype: float64
    doc: Trace value at the detected transient peak.
- neurodata_type_def: GuppyTransientSummaryTable
  neurodata_type_inc: DynamicTable
  doc: 'Per-session GuPPy transient summary: one row per (recording_site, trace_type)
    with event frequency and mean peak amplitude. recording_site and trace_type vary
    per row, so they are columns.'
  datasets:
  - name: recording_site
    neurodata_type_inc: DynamicTableRegion
    doc: Reference to the GuppyRecordingSitesTable row for this summary row's 
      recording site.
  - name: trace_type
    neurodata_type_inc: VectorData
    dtype: text
    doc: "The GuPPy normalized trace this object was computed from. Controlled vocabulary:
      'control_fit', 'dff', or 'z_score'."
  - name: frequency_per_min
    neurodata_type_inc: VectorData
    dtype: float64
    doc: Transient frequency in events per minute.
  - name: mean_amplitude
    neurodata_type_inc: VectorData
    dtype: float64
    doc: Mean amplitude of the detected transient peaks.
- neurodata_type_def: GuppyPSTH
  neurodata_type_inc: NWBDataInterface
  doc: Peri-event PSTH for one (recording_site, trace_type) condition, 
    concatenated across events. The per-trial 'traces' matrix stacks every 
    event's trials along the trials axis (each trial labeled by the per-trial 
    'event' reference); 'mean'/'error' hold GuPPy's across-trial summary, one 
    column per event ('summary_event'). The baseline-uncorrected variant is a 
    second GuppyPSTH with baseline_corrected=False.
  attributes:
  - name: description
    dtype: text
    doc: Human-readable description of this PSTH.
  - name: trace_type
    dtype: text
    doc: "The GuPPy normalized trace this object was computed from. Controlled vocabulary:
      'control_fit', 'dff', or 'z_score'."
  - name: baseline_corrected
    dtype: bool
    doc: Whether per-trial baseline correction was applied.
  - name: unit
    dtype: text
    doc: Unit of the PSTH values (matches the trace_type).
  datasets:
  - name: recording_site
    neurodata_type_inc: DynamicTableRegion
    doc: Reference to the GuppyRecordingSitesTable row for this PSTH's recording
      site (single row).
  - name: event
    neurodata_type_inc: DynamicTableRegion
    doc: "Per-trial reference into GuppyEventsTable: one row per trial (shape (num_trials,)),
      labeling which event each column of 'traces' was aligned to."
  - name: summary_event
    neurodata_type_inc: DynamicTableRegion
    doc: "Per-summary-column reference into GuppyEventsTable: one row per event type
      (shape (num_events,)), labeling the columns of 'mean'/'error'."
  - name: peri_event_time
    dtype: float64
    dims:
    - num_samples
    shape:
    - null
    doc: Peri-event time axis in seconds (relative to event onset), shape 
      (num_samples,).
  - name: trial_onset_times
    dtype: float64
    dims:
    - num_trials
    shape:
    - null
    doc: Absolute onset time of each trial in seconds (session clock), shape 
      (num_trials,), concatenated across events in the same order as the 
      'traces' columns.
  - name: traces
    dtype: float64
    dims:
    - num_samples
    - num_trials
    shape:
    - null
    - null
    doc: Per-trial response, shape (num_samples, num_trials). Time is the first 
      axis. Trials from every event are concatenated along the second axis; see 
      the 'event' reference.
  - name: mean
    dtype: float64
    dims:
    - num_samples
    - num_events
    shape:
    - null
    - null
    doc: Across-trial mean at each peri-event time, one column per event, shape 
      (num_samples, num_events).
  - name: error
    dtype: float64
    dims:
    - num_samples
    - num_events
    shape:
    - null
    - null
    doc: Across-trial error (e.g. SEM) at each peri-event time, one column per 
      event, shape (num_samples, num_events).
  - name: bin_edges
    dtype: float64
    dims:
    - num_bins
    - start_stop
    shape:
    - null
    - 2
    doc: Optional bin definitions, shape (num_bins, 2), concatenated across 
      events. Each row is [start, stop); interpreted as trial-index ranges or 
      time ranges according to the bin_basis attribute. See the 'bin_event' 
      reference for each bin's event.
    quantity: '?'
    attributes:
    - name: bin_basis
      dtype: text
      doc: Whether bins are defined over 'trials' or 'time'.
  - name: bin_event
    neurodata_type_inc: DynamicTableRegion
    doc: "Per-bin reference into GuppyEventsTable: one row per bin (shape (num_bins,)),
      labeling the columns of 'binned_mean'/'binned_error'."
    quantity: '?'
  - name: binned_mean
    dtype: float64
    dims:
    - num_samples
    - num_bins
    shape:
    - null
    - null
    doc: Optional per-bin mean, shape (num_samples, num_bins), concatenated 
      across events.
    quantity: '?'
  - name: binned_error
    dtype: float64
    dims:
    - num_samples
    - num_bins
    shape:
    - null
    - null
    doc: Optional per-bin error, shape (num_samples, num_bins), concatenated 
      across events.
    quantity: '?'
- neurodata_type_def: GuppyCrossCorrelation
  neurodata_type_inc: NWBDataInterface
  doc: Peri-event cross-correlation for one (trace_type, recording-site-pair) 
    condition, concatenated across events, stored as a lags-by-trials matrix 
    over a lag axis. The recording_site reference points at two rows 
    (recording_site_1, recording_site_2); the per-trial 'event' reference labels
    each trials column and 'mean'/'error' hold the across-trial summary, one 
    column per event ('summary_event').
  attributes:
  - name: description
    dtype: text
    doc: Human-readable description of this cross-correlation.
  - name: trace_type
    dtype: text
    doc: "The GuPPy normalized trace this object was computed from. Controlled vocabulary:
      'control_fit', 'dff', or 'z_score'."
  - name: unit
    dtype: text
    doc: Unit of the cross-correlation values (normalized; typically 'a.u.').
  datasets:
  - name: recording_site
    neurodata_type_inc: DynamicTableRegion
    doc: Reference to the two GuppyRecordingSitesTable rows (recording_site_1, 
      recording_site_2) for this cross-correlation.
  - name: event
    neurodata_type_inc: DynamicTableRegion
    doc: "Per-trial reference into GuppyEventsTable: one row per trial (shape (num_trials,)),
      labeling which event each column of 'trials' was aligned to."
  - name: summary_event
    neurodata_type_inc: DynamicTableRegion
    doc: "Per-summary-column reference into GuppyEventsTable: one row per event type
      (shape (num_events,)), labeling the columns of 'mean'/'error'."
  - name: lag
    dtype: float64
    dims:
    - num_lags
    shape:
    - null
    doc: Lag axis in seconds (symmetric around zero), shape (num_lags,).
  - name: trial_onset_times
    dtype: float64
    dims:
    - num_trials
    shape:
    - null
    doc: Absolute onset time of each trial in seconds (session clock), shape 
      (num_trials,), concatenated across events in the same order as the 
      'trials' columns.
  - name: trials
    dtype: float64
    dims:
    - num_lags
    - num_trials
    shape:
    - null
    - null
    doc: Per-trial cross-correlation, shape (num_lags, num_trials). Lag is the 
      first axis. Trials from every event are concatenated along the second 
      axis; see the 'event' reference.
  - name: mean
    dtype: float64
    dims:
    - num_lags
    - num_events
    shape:
    - null
    - null
    doc: Across-trial mean cross-correlation at each lag, one column per event, 
      shape (num_lags, num_events).
  - name: error
    dtype: float64
    dims:
    - num_lags
    - num_events
    shape:
    - null
    - null
    doc: Across-trial error at each lag, one column per event, shape (num_lags, 
      num_events).
  - name: bin_edges
    dtype: float64
    dims:
    - num_bins
    - start_stop
    shape:
    - null
    - 2
    doc: Optional bin definitions, shape (num_bins, 2), concatenated across 
      events. Each row is [start, stop); interpreted as trial-index ranges or 
      time ranges according to the bin_basis attribute. See the 'bin_event' 
      reference for each bin's event.
    quantity: '?'
    attributes:
    - name: bin_basis
      dtype: text
      doc: Whether bins are defined over 'trials' or 'time'.
  - name: bin_event
    neurodata_type_inc: DynamicTableRegion
    doc: "Per-bin reference into GuppyEventsTable: one row per bin (shape (num_bins,)),
      labeling the columns of 'binned_mean'/'binned_error'."
    quantity: '?'
  - name: binned_mean
    dtype: float64
    dims:
    - num_lags
    - num_bins
    shape:
    - null
    - null
    doc: Optional per-bin mean, shape (num_lags, num_bins), concatenated across 
      events.
    quantity: '?'
  - name: binned_error
    dtype: float64
    dims:
    - num_lags
    - num_bins
    shape:
    - null
    - null
    doc: Optional per-bin error, shape (num_lags, num_bins), concatenated across
      events.
    quantity: '?'
- neurodata_type_def: GuppyPeakAUC
  neurodata_type_inc: NWBDataInterface
  doc: Peak and area-under-curve summary of a peri-event PSTH for one 
    (recording_site, trace_type) condition, concatenated across events. GuPPy 
    computes peak_positive, peak_negative, and area for every trial, every bin, 
    and the across-trial mean within each peak window. The per-trial metric 
    matrices stack every event's trials along the trials axis (labeled by the 
    per-trial 'event' reference); the mean_* metrics hold one column per event 
    ('summary_event').
  attributes:
  - name: description
    dtype: text
    doc: Human-readable description of this peak/AUC summary.
  - name: trace_type
    dtype: text
    doc: "The GuPPy normalized trace this object was computed from. Controlled vocabulary:
      'control_fit', 'dff', or 'z_score'."
  - name: unit
    dtype: text
    doc: Unit of the peak/area values (matches the trace_type).
  datasets:
  - name: recording_site
    neurodata_type_inc: DynamicTableRegion
    doc: Reference to the GuppyRecordingSitesTable row for this summary's 
      recording site (single row).
  - name: event
    neurodata_type_inc: DynamicTableRegion
    doc: 'Per-trial reference into GuppyEventsTable: one row per trial (shape (num_trials,)),
      labeling which event each column of the per-trial metric matrices was aligned
      to.'
  - name: summary_event
    neurodata_type_inc: DynamicTableRegion
    doc: 'Per-summary-column reference into GuppyEventsTable: one row per event type
      (shape (num_events,)), labeling the columns of the mean_* metrics.'
  - name: window_start
    dtype: float64
    dims:
    - num_windows
    shape:
    - null
    doc: Start of each peak window in seconds (relative to event onset), shape 
      (num_windows,).
  - name: window_stop
    dtype: float64
    dims:
    - num_windows
    shape:
    - null
    doc: Stop of each peak window in seconds (relative to event onset), shape 
      (num_windows,).
  - name: trial_onset_times
    dtype: float64
    dims:
    - num_trials
    shape:
    - null
    doc: Absolute onset time of each trial in seconds (session clock), shape 
      (num_trials,), concatenated across events in the same order as the 
      per-trial metric columns.
  - name: peak_positive
    dtype: float64
    dims:
    - num_windows
    - num_trials
    shape:
    - null
    - null
    doc: Per-trial maximum within each window, shape (num_windows, num_trials), 
      concatenated across events.
  - name: peak_negative
    dtype: float64
    dims:
    - num_windows
    - num_trials
    shape:
    - null
    - null
    doc: Per-trial minimum within each window, shape (num_windows, num_trials), 
      concatenated across events.
  - name: area_under_curve
    dtype: float64
    dims:
    - num_windows
    - num_trials
    shape:
    - null
    - null
    doc: Per-trial area within each window (trapezoidal), shape (num_windows, 
      num_trials), concatenated across events.
  - name: mean_peak_positive
    dtype: float64
    dims:
    - num_windows
    - num_events
    shape:
    - null
    - null
    doc: Across-trial-mean trace maximum within each window, one column per 
      event, shape (num_windows, num_events).
  - name: mean_peak_negative
    dtype: float64
    dims:
    - num_windows
    - num_events
    shape:
    - null
    - null
    doc: Across-trial-mean trace minimum within each window, one column per 
      event, shape (num_windows, num_events).
  - name: mean_area_under_curve
    dtype: float64
    dims:
    - num_windows
    - num_events
    shape:
    - null
    - null
    doc: Across-trial-mean trace area within each window (trapezoidal), one 
      column per event, shape (num_windows, num_events).
  - name: bin_edges
    dtype: float64
    dims:
    - num_bins
    - start_stop
    shape:
    - null
    - 2
    doc: Optional bin definitions, shape (num_bins, 2), concatenated across 
      events. Each row is [start, stop); interpreted as trial-index ranges or 
      time ranges according to the bin_basis attribute. See the 'bin_event' 
      reference for each bin's event.
    quantity: '?'
    attributes:
    - name: bin_basis
      dtype: text
      doc: Whether bins are defined over 'trials' or 'time'.
  - name: bin_event
    neurodata_type_inc: DynamicTableRegion
    doc: 'Per-bin reference into GuppyEventsTable: one row per bin (shape (num_bins,)),
      labeling the columns of the binned_* metrics.'
    quantity: '?'
  - name: binned_peak_positive
    dtype: float64
    dims:
    - num_windows
    - num_bins
    shape:
    - null
    - null
    doc: Optional per-bin (binned-mean trace) maximum within each window, shape 
      (num_windows, num_bins), concatenated across events.
    quantity: '?'
  - name: binned_peak_negative
    dtype: float64
    dims:
    - num_windows
    - num_bins
    shape:
    - null
    - null
    doc: Optional per-bin (binned-mean trace) minimum within each window, shape 
      (num_windows, num_bins), concatenated across events.
    quantity: '?'
  - name: binned_area_under_curve
    dtype: float64
    dims:
    - num_windows
    - num_bins
    shape:
    - null
    - null
    doc: Optional per-bin (binned-mean trace) area within each window, shape 
      (num_windows, num_bins), concatenated across events.
    quantity: '?'
- neurodata_type_def: GuppyValidSignalIntervals
  neurodata_type_inc: TimeIntervals
  doc: Time intervals retained as valid signal (not removed as artifacts) during
    GuPPy preprocessing, one row per interval with a structured recording-site 
    reference. Sourced from coordsForPreProcessing_<recording_site>.npy; the 
    removal method is recorded once on GuppyParameters.artifacts_removal_method.
  datasets:
  - name: recording_site
    neurodata_type_inc: DynamicTableRegion
    doc: Reference to the GuppyRecordingSitesTable row this interval applies to.
- neurodata_type_def: GuppyParameters
  neurodata_type_inc: LabMetaData
  doc: Typed GuPPy processing parameters for the session (from 
    GuPPyParamtersUsed.json). One per session; applies to the co-located GuPPy 
    products.
  attributes:
  - name: guppy_version
    dtype: text
    doc: GuPPy version string.
    required: false
  - name: zscore_method
    dtype: text
    doc: Z-score computation method.
    required: false
  - name: baseline_window_start
    dtype: float64
    doc: Baseline window start (seconds) for normalization.
    required: false
  - name: baseline_window_end
    dtype: float64
    doc: Baseline window end (seconds) for normalization.
    required: false
  - name: filter_window
    dtype: float64
    doc: Filtering window used for the control fit.
    required: false
  - name: isosbestic_control
    dtype: bool
    doc: Whether an isosbestic control channel was used (vs a synthetic fit).
    required: false
  - name: remove_artifacts
    dtype: bool
    doc: Whether artifact removal was performed.
    required: false
  - name: artifacts_removal_method
    dtype: text
    doc: Artifact removal method (e.g. 'concatenate' or 'replace with NaN').
    required: false
  - name: transients_thresh
    dtype: float64
    doc: Transient detection threshold.
    required: false
  - name: high_amp_filt
    dtype: float64
    doc: High-amplitude filter for transient detection.
    required: false
  - name: moving_window
    dtype: float64
    doc: Moving window for transient detection.
    required: false
  - name: n_sec_prev
    dtype: float64
    doc: Seconds before event onset for PSTH windows.
    required: false
  - name: n_sec_post
    dtype: float64
    doc: Seconds after event onset for PSTH windows.
    required: false
  - name: time_interval
    dtype: float64
    doc: Minimum inter-event interval for PSTH trial inclusion (seconds).
    required: false
  - name: bin_psth_trials
    dtype: int32
    doc: Number of trials per PSTH bin (0 if unbinned).
    required: false
  - name: baseline_correction_start
    dtype: float64
    doc: PSTH baseline-correction window start (seconds).
    required: false
  - name: baseline_correction_end
    dtype: float64
    doc: PSTH baseline-correction window end (seconds).
    required: false
  datasets:
  - name: peak_start_points
    dtype: float64
    dims:
    - num_windows
    shape:
    - null
    doc: Optional peak/AUC window start points (seconds), shape (num_windows,).
    quantity: '?'
  - name: peak_end_points
    dtype: float64
    dims:
    - num_windows
    shape:
    - null
    doc: Optional peak/AUC window end points (seconds), shape (num_windows,).
    quantity: '?'
